# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on the Gradle wiring itself. Does not need the native
  # submodules, so it finishes long before the full build does.
  configure:
    name: Configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: ./gradlew :app:dependencies --configuration freeDebugRuntimeClasspath --stacktrace

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          NDK=$(grep -oP '(?<=^ndk = ")[^"]+' gradle/libs.versions.toml)
          sdkmanager --install "ndk;$NDK" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleFreeDebug assembleNonfreeDebug --stacktrace

      # A 4 KB aligned .so fails to load on 16 KB page devices, which Android 16
      # mandates for apps targeting SDK 36+. The failure is silent at build
      # time, so assert it here instead.
      # A 4 KB aligned .so fails to load on 16 KB page devices, which Android 16
      # mandates for apps targeting SDK 36+. The failure is silent at build
      # time, so assert it on the packaged APKs here.
      - name: Check 16 KB page alignment
        run: python3 tools/check_elf_alignment.py $(find app/build/outputs/apk -name '*.apk')

      - name: Unit tests
        run: ./gradlew testFreeDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintFreeDebug --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
