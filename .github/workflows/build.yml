# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --warning-mode all --stacktrace

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        shell: bash
        run: |
          NDK=$(grep -oP '(?<=ndkVersion = ")[^"]+' app/build.gradle.kts)
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager.bat"
          [ -f "$SDKM" ] || SDKM=sdkmanager
          "$SDKM" --install "ndk;$NDK" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        shell: bash
        run: ./gradlew assembleDebug --stacktrace

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          NDK=$(grep -oP '(?<=ndkVersion = ")[^"]+' app/build.gradle.kts)
          sdkmanager --install "ndk;$NDK" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Check 16 KB page alignment
        run: |
          fail=0
          readelf=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | head -1)
          work=$(mktemp -d)
          for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
            echo "== $apk"
            rm -rf "$work/x"
            unzip -oq "$apk" 'lib/*' -d "$work/x" || continue
            for so in $(find "$work/x" -name '*.so' | sort); do
              align=$("$readelf" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
              echo "   ${so#$work/x/} -> $align"
              case "$align" in "0x4000 ") ;; *) echo "::error::${so#$work/x/} in $apk is not 16 KB aligned ($align)"; fail=1 ;; esac
            done
          done
          exit $fail

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Lint report
        if: always()
        run: cat app/build/reports/lint-results-*.txt || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            !app/build/outputs/apk/androidTest/**
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
