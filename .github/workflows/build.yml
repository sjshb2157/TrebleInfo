# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --warning-mode all --stacktrace

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          NDK=$(grep -oP '(?<=ndkVersion = ")[^"]+' app/build.gradle.kts)
          CMAKE=$(grep -oP '(?<=version = ")[0-9][0-9.]*(?=")' app/build.gradle.kts | head -1)
          sdkmanager --install "ndk;$NDK" "cmake;$CMAKE"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Check 16 KB page alignment
        run: |
          fail=0
          readelf=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | head -1)
          work=$(mktemp -d)
          for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
            echo "== $apk"
            rm -rf "$work/x"
            unzip -oq "$apk" 'lib/*' -d "$work/x" || continue
            for so in $(find "$work/x" -name '*.so' | sort); do
              align=$("$readelf" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
              echo "   ${so#$work/x/} -> $align"
              case "$align" in "0x4000 ") ;; *) echo "::error::${so#$work/x/} in $apk is not 16 KB aligned ($align)"; fail=1 ;; esac
            done
          done
          exit $fail

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Lint report
        if: always()
        run: cat app/build/reports/lint-results-*.txt || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            !app/build/outputs/apk/androidTest/**
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests
    # The emulator run costs about fifteen minutes, so keep it off pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          NDK=$(grep -oP '(?<=ndkVersion = ")[^"]+' app/build.gradle.kts)
          CMAKE=$(grep -oP '(?<=version = ")[0-9][0-9.]*(?=")' app/build.gradle.kts | head -1)
          sdkmanager --install "ndk;$NDK" "cmake;$CMAKE"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest -PemulatorAbi=x86_64 --stacktrace

      - name: Instrumented test report
        if: always()
        run: |
          for f in app/build/outputs/androidTest-results/connected/**/*.xml; do
            [ -f "$f" ] && echo "== $f" && cat "$f"
          done || true
