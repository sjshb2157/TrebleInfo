[versions]
# --- build ---------------------------------------------------------------
agp = "9.3.2"
# AGP 9 compiles Kotlin itself (built-in Kotlin). AGP 9.3.2 embeds a 2.2.x
# compiler, and the compose/parcelize compiler plugins must match it exactly,
# so this is not a free choice.
kotlin = "2.2.10"
# r28 was the first NDK to link with 16 KB page alignment by default; the
# CMake build asks for it explicitly anyway, so this can track the latest.
ndk = "30.0.16138531"

# --- Android SDK ---------------------------------------------------------
compileSdk = "37"
targetSdk = "37"
# navigation-runtime 2.10.0 declares minSdk 24, so 23 no longer merges.
minSdk = "24"

# Held at 14.x: 15.x is built with Kotlin 2.4 and drags kotlin-stdlib 2.4 onto
# the compile classpath, whose metadata AGP's built-in 2.2 compiler cannot read
# (it reads up to 2.3.0). 14.2.1 ships stdlib 2.3.20 and has the same runtime
# API, so Licenses.kt is unaffected. Every androidx dependency is still on
# stdlib 2.0/2.1 and is fine.
aboutlibraries = "14.2.1"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.0"

# --- nonfree -------------------------------------------------------------
billing = "9.1.0"

# --- test ----------------------------------------------------------------
junit = "4.13.2"
mockk = "1.14.11"
xmlpull = "1.1.3.1"
kxml2 = "2.3.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
screengrab = "2.1.1"

# --- build-logic ---------------------------------------------------------
commonsIo = "2.22.0"
kotlinXmlBuilder = "1.9.3"

[libraries]
# Consumed by the included builds in build-logic/ (compileOnly).
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
kotlin-xml-builder = { module = "org.redundent:kotlin-xml-builder", version.ref = "kotlinXmlBuilder" }

aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-windowsizeclass = { module = "androidx.compose.material3:material3-window-size-class" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

test-junit = { module = "junit:junit", version.ref = "junit" }
test-mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
test-mockk-agent-jvm = { module = "io.mockk:mockk-agent-jvm", version.ref = "mockk" }
test-xmlpull = { module = "xmlpull:xmlpull", version.ref = "xmlpull" }
test-kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
screengrab = { module = "tools.fastlane:screengrab", version.ref = "screengrab" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
