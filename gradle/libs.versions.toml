[versions]
agp = "9.3.2"
# Must match the compiler AGP embeds for built-in Kotlin.
kotlin = "2.2.10"
ndk = "30.0.16138531"

compileSdk = "37"
targetSdk = "37"
# Treble starts at API 26.
minSdk = "26"

# 15.x needs kotlin-stdlib 2.4, whose metadata AGP's built-in compiler cannot
# read. Same runtime API.
aboutlibraries = "15.2.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.0"

billing = "9.1.0"

junit = "4.13.2"
mockk = "1.14.11"
xmlpull = "1.1.3.1"
kxml2 = "2.3.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
screengrab = "2.1.1"

commonsIo = "2.22.0"
kotlinXmlBuilder = "1.9.3"

[libraries]
# For the included builds in build-logic/.
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
kotlin-xml-builder = { module = "org.redundent:kotlin-xml-builder", version.ref = "kotlinXmlBuilder" }

aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-windowsizeclass = { module = "androidx.compose.material3:material3-window-size-class" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

test-junit = { module = "junit:junit", version.ref = "junit" }
test-mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
test-mockk-agent-jvm = { module = "io.mockk:mockk-agent-jvm", version.ref = "mockk" }
test-xmlpull = { module = "xmlpull:xmlpull", version.ref = "xmlpull" }
test-kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
screengrab = { module = "tools.fastlane:screengrab", version.ref = "screengrab" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
